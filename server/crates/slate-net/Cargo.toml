[package]
name = "slate-net"
description = "Networking for Plasma Slate: TLS identity, acceptor, mDNS advertisement"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
if-addrs = "0.15"
mdns-sd = "0.21"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
sha2 = "0.10"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread", "io-util"] }
