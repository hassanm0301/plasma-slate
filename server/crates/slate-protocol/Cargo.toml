[package]
name = "slate-protocol"
description = "Plasma Slate wire protocol: generated messages and framing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["io-util"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
