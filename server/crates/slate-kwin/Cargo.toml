[package]
name = "slate-kwin"
description = "KWin integration: virtual outputs, EIS touch injection, output configuration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reis = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "process", "rt", "macros"] }
tracing = "0.1"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }
